<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasar Logistik Naratama</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#17243a;--mut:#6d7788;--navy:#16304f;--green:#4f7d57;--green2:#7bb083;--gold:#c19d57;--line:#e8e3d8;--bad:#c94a4a;--ok:#2f9461;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--card:#142031;--tx:#eaf0f8;--mut:#8fa0b8;--navy:#5b86c2;--green:#6fae78;--green2:#9bd3a3;--line:#233349}}
:root[data-theme="dark"]{--bg:#0d1520;--card:#142031;--tx:#eaf0f8;--mut:#8fa0b8;--navy:#5b86c2;--green:#6fae78;--green2:#9bd3a3;--line:#233349}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;line-height:1.2}
main{max-width:720px;margin:0 auto;padding:12px 14px 160px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.lg{display:inline-grid;place-items:center;background:#fff;border-radius:12px;width:42px;height:42px;box-shadow:0 2px 8px #0002;flex:none}.lg img{width:28px;display:block}
.hd b{font:700 17px 'Fraunces',serif;color:var(--navy);display:block;line-height:1.1}.hd small{font-size:9px;letter-spacing:3px;color:var(--mut);font-weight:800}.sp{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--navy);color:#fff;transition:transform .15s,filter .15s;width:100%}
.btn:active{transform:scale(.96);filter:brightness(.9)}.btn.g{background:linear-gradient(135deg,var(--green),var(--green2))}.btn.r{background:var(--bad)}.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--line)}.btn.s{width:auto;padding:8px 14px;font-size:13px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--green)}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.hero{background:linear-gradient(135deg,#16304f,#2b4a73);color:#fff;border:0;padding:18px;position:relative;overflow:hidden}.hero:after{content:"🛒";position:absolute;right:14px;top:6px;font-size:64px;opacity:.18}.hero h2{font-size:22px}.hero p{margin:4px 0 0;opacity:.85;font-size:13px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.cats span{flex:none;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;background:var(--card);color:var(--mut);transition:.2s}.cats .on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;animation:fade .4s both;position:relative}
.pi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#4f7d5722,#c19d5722)}
.p b{font-size:14px;line-height:1.25}.p small{color:var(--mut);font-size:12px}.pr{font:700 18px 'Fraunces',serif;color:var(--navy)}
.bd{position:absolute;top:10px;right:10px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:#c9a24d33;color:#9a6f0b}.bd.x{background:#c94a4a22;color:var(--bad)}
.st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.st button{border:0;width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:800;cursor:pointer;background:var(--bg);color:var(--tx)}.st .plus{background:var(--green);color:#fff}.st span{font-weight:800;min-width:22px;text-align:center}
.add{width:100%;border:0;border-radius:11px;padding:9px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}.add:disabled{background:var(--line);color:var(--mut)}
.add:active,.st button:active{transform:scale(.92)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(92%,420px);z-index:15;background:linear-gradient(135deg,var(--navy),#2b4a73);color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px #0005;cursor:pointer;animation:rise .35s cubic-bezier(.3,1.4,.5,1)}@keyframes rise{from{transform:translate(-50%,30px);opacity:0}}
.bar b{font-size:16px}.bar small{opacity:.8;display:block;font-size:12px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 30px #0003;border-radius:30px;padding:7px;display:flex;gap:4px;z-index:16}
nav button{border:0;background:none;color:var(--mut);display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:22px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:.3s,transform .15s}nav button span{max-width:0;overflow:hidden;white-space:nowrap}nav button:active{transform:scale(.88)}
nav button.on{background:linear-gradient(135deg,var(--navy),#2b4a73);color:#fff;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}nav button.on span{max-width:80px;animation:lbl .3s}@keyframes pop{from{transform:scale(.85)}}@keyframes lbl{from{max-width:0;opacity:0}}
#md{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:40}#md.on{display:flex}
#md>div{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}@keyframes up{from{transform:translateY(60px);opacity:0}}
#md>div:before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:60;display:none;font-weight:700;max-width:90%}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .m{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff;background:var(--navy)}.tag.diproses{background:#c58a1d}.tag.selesai{background:var(--ok)}.tag.batal{background:var(--bad)}
.okc{width:96px;height:96px;display:block;margin:6px auto 0;animation:okp .5s cubic-bezier(.3,1.6,.5,1)}.okc1{stroke:var(--ok);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s ease forwards}.okc2{stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}@keyframes okp{from{transform:scale(.4);opacity:0}}
.okt{background:var(--bg);border-radius:14px;padding:2px 14px;margin-bottom:10px;animation:fi .6s .7s both}.okt div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.okt div:last-child{border:0}.okt span{color:var(--mut)}@keyframes fi{from{opacity:0}}
.empty{padding:34px 10px;text-align:center;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font:700 20px 'Fraunces',serif;color:var(--navy)}.stats span{font-size:11px;color:var(--mut);font-weight:700}
</style></head><body>

 try{let j;if(m==='up')j=await act('nb_register',{p_name:v('an').trim(),p_user:u,p_pin:p});else if(u==='admin')j=await act('nb_admin_login',{p_pin:p});else j=await act('nb_login',{p_user:u,p_pin:p});

function prodF(id){const p=id?S.ap.find(x=>x.id===id):{name:'',cat:S.cat!=='all'?S.cat:'',unit:'pcs',price:'',stock:0,icon:'📦',active:true};if(!p)return;const cats=[...new Set(S.ap.map(x=>x.cat))];
 modal(`<h3>${id?'Ubah':'Tambah'} Produk</h3><label>Nama</label><input id="pn" maxlength="40" value="${esc(p.name)}"><label>Kategori</label><input id="pc" maxlength="30" list="cl" value="${esc(p.cat)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="two"><div><label>Harga ($)</label><input id="pp" type="number" inputmode="numeric" value="${p.price}"></div><div><label>Stok</label><input id="ps" type="number" inputmode="numeric" value="${p.stock}"></div></div><div class="two"><div><label>Satuan</label><input id="pu" maxlength="12" value="${esc(p.unit)}"></div><div><label>Ikon (emoji)</label><input id="pe" maxlength="8" value="${esc(p.icon)}"></div></div><label>Status</label><select id="pa"><option value="1" ${p.active?'selected':''}>Aktif (tampil di toko)</option><option value="0" ${p.active?'':'selected'}>Nonaktif (disembunyikan)</option></select>
 <p style="margin:16px 0 0"><button class="btn g" onclick="saveP(${id||'null'})">Simpan</button></p>${id?`<p style="margin:8px 0 0"><button class="btn r" onclick="delP(${id})">Hapus Produk</button></p>`:''}<p style="margin:8px 0 0"><button class="btn o" onclick="closeM()">Batal</button></p>`)}
async function saveP(id){const price=Math.floor(+v('pp')),stock=Math.floor(+v('ps'));if(!(price>=1))return toast('Isi harga');if(!(stock>=0))return toast('Stok tidak valid');if(S.busy)return;S.busy=true;
 try{await act('lg_admin_product_save',{p_token:TOK,p_id:id,p_name:v('pn'),p_cat:v('pc'),p_unit:v('pu'),p_price:price,p_stock:stock,p_icon:v('pe'),p_active:v('pa')==='1'});closeM();toast('Produk tersimpan');await loadAdm();await loadCat()}catch(e){}S.busy=false}
function delP(id){modal(`<h3>Hapus produk?</h3><p class="mut">Riwayat pesanan lama tetap tersimpan.</p><button class="btn r" onclick="doDelP(${id})">Ya, Hapus</button><p style="margin:8px 0 0"><button class="btn o" onclick="closeM()">Batal</button></p>`)}
async function doDelP(id){closeM();try{await act('lg_admin_product_delete',{p_token:TOK,p_id:id});toast('Produk dihapus');await loadAdm();await loadCat()}catch(e){}}
/* ===== render ===== */
function render(){const adm=S.me&&S.me.admin,n=cnt();
 $('#hr').innerHTML=S.me?(adm?'<span class="chip">ADMIN</span>':`<span class="chip" onclick="setV('acc')">${money(S.me.bal)}</span>`):'<button class="btn s" onclick="authM(\'in\')">Masuk</button>';
 const V=adm?(S.view==='aprod'?aprodView():S.view==='acc'?accView():S.view==='shop'?shopView():aordView()):S.view==='orders'?ordersView():S.view==='acc'?accView():shopView();
 $('#app').innerHTML=V;
 const items=adm?[['aord','📋','Pesanan'],['aprod','📦','Produk'],['shop','🛒','Toko'],['acc','👤','Akun']]:[['shop','🛒','Belanja'],['orders','📋','Pesanan'],['acc','👤','Akun']];
 $('#nv').innerHTML=items.map(([k,i,l])=>`<button class="${(adm&&S.view==='aord'&&k==='aord')||S.view===k||(adm&&!['aprod','acc','shop'].includes(S.view)&&k==='aord')?'on':''}" onclick="setV('${k}')">${i}<span>${l}</span></button>`).join('');
 $('#bar').innerHTML=(n&&!adm&&S.view==='shop')?`<div class="bar" onclick="openCart()"><div><b>🛒 ${n} barang</b><small>Ketuk untuk melihat keranjang</small></div><b>${money(total())}</b></div>`:''}
render();loadCat();loadMe();
</script></body></html>
